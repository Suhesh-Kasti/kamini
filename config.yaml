# ================================================================
# QUESTIONS
# All flow lives here. Roles and behaviors are in src/scripts.
# transition_out: "theme" uses the active theme's motion language.
# ================================================================
# Core game registry. Ready games are selectable by the session planner.
# Coming soon games are visible in settings but never chosen.
minigames:
- id: scratch_card
  name: scratch the card
  description: rub the soft cover until the picture underneath peeks through.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: scratch until the picture opens.
    image: images/portrait-02.webp
    reveal: the laughing one. you hate it. I know.
    caption: lock screen. no regrets.
- id: camera_selfie
  name: catch the little camera
  description: catch the camera and it takes one still. local only.
  device_support:
  - camera
  - touch
  - mouse
  permissions:
  - camera
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    title: let me see the face I am trying to make smile
    body: This stays on your phone. Nothing is uploaded. This is just for you and me.
    note: look at you, being all pretty while I am being sneaky.
    caption: kept on {date}
    prompt: catch the little camera. it is quicker than you think.
- id: catch_object
  name: catch the little heart
  description: a tiny heart drifts and dodges. catch it.
  device_support:
  - touch
  - mouse
  - sensor_gyro
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    target: the little heart
    icon: heart
    hint: caught it. it is both. obviously.
- id: drag_to_target
  name: drag it home
  description: drag the right little thing into the basket.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    target: the basket
    items:
    - label: dusty rose
      color: '#c98a92'
    - label: warm sage
      color: '#9aa37f'
      correct: true
    - label: butter cream
      color: '#e8d6a3'
    success: warm sage. good taste.
    hint: the warm one. the one that matches your patience.
- id: tilt_pour
  name: tilt to pour
  description: tilt the phone, or steer with the mouse, and pour the sparks home.
  device_support:
  - sensor_gyro
  - touch
  - mouse
  permissions:
  - motion
  fallback_game_id: drag_to_target
  enabled_by_default: true
  status: ready
  content:
    prompt: tilt until the basket is full.
- id: hold_fill
  name: hold to fill
  description: press and hold until the little heart is full. let go early and it deflates.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: hold the heart until it is full.
    label: hold
- id: sort_bins
  name: sort the little things
  description: tap a thing, then tap the bin it belongs in.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: tap a thing, then tap keep or let go.
    bins:
    - keep
    - let go
    items:
    - label: the park one
      bin: keep
    - label: the laughing one
      bin: keep
    - label: the delete button
      bin: let go
- id: pet_character
  name: pet the sleepy cat
  description: swipe gently over the cat until it stretches awake.
  device_support:
  - touch
  - mouse
  - sensor_accel
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: the cat is sleeping on the evidence. pet it awake.
    character: cat
- id: wipe_fog
  name: wipe the fog
  description: clear the misty glass to see what is hiding underneath.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: scratch_card
  enabled_by_default: true
  status: ready
  content:
    prompt: wipe the fog away.
    reveal: the evidence is still here.
    caption: through the mist.
- id: memory_match
  name: match the little pairs
  description: turn over the cards and find the pairs.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: find the pairs. the cat is judging your memory.
    icons:
    - cat
    - dog
    - heart
    - star
- id: choose_item
  name: pick one
  description: a small table of nice things. pick the one that feels right.
  device_support:
  - touch
  - mouse
  - keyboard
  permissions:
  - none
  fallback_game_id: hold_fill
  enabled_by_default: true
  status: ready
  content:
    prompt: pick one. I will pretend not to have a favourite.
    items:
    - dusty rose
    - warm sage
    - butter cream
    correct: warm sage
- id: pull_thread
  name: pull the thread
  description: pull the loose thread and let the ball unravel into a note.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: drag_to_target
  enabled_by_default: true
  status: ready
  required_theme_affinity:
  - cozy_crochet
  content:
    prompt: pull the thread.
    reveal: the photos are still staying.
- id: blow_reveal
  name: blow the cloud away
  description: a little breath clears the cloud. needs a microphone.
  device_support:
  - mic
  - touch
  - mouse
  permissions:
  - mic
  fallback_game_id: wipe_fog
  enabled_by_default: true
  status: ready
  content:
    prompt: blow at the cloud. a little puff is enough.
    reveal: there it is.
    caption: gone with a breath.
- id: rhythm_tap
  name: tap on the beat
  description: tap along and fill the little bar.
  device_support:
  - touch
  - mouse
  - keyboard
  permissions:
  - none
  fallback_game_id: hold_fill
  enabled_by_default: true
  status: ready
  content:
    prompt: tap when the ring blooms.
    hits: 6
    miss: almost. listen for the next one.
    hit: there.
- id: trace_line
  name: trace the line
  description: follow the dotted path without lifting your finger.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: follow the dotted line without lifting your finger.
    reveal: traced. remembered.
    caption: the line knows.
- id: shake_reveal
  name: shake it out
  description: a gentle shake shakes the hidden thing loose.
  device_support:
  - sensor_accel
  - touch
  permissions:
  - motion
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: shake the little box. gently.
    reveal: the note was in there.
    caption: shaken loose.
- id: feed_cat
  name: feed the cat
  description: drag a little snack to the cat and watch its face change.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: pet_character
  enabled_by_default: true
  status: ready
  content:
    prompt: feed the cat. it is supervising.
    foods:
    - label: a little fish
      icon: fish
    - label: a cookie
      icon: cookie-bite
    - label: a strawberry
      icon: heart
    full: full. happy. still judging you.
- id: spin_wheel
  name: spin the little wheel
  description: a soft wheel, a little swipe, and wherever it lands.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: spin it. whatever it lands on is true.
    segments:
    - both
    - both
    - obviously
    - both
    - framed
    - both
    result: both. obviously.

# Fixed story spine. Each beat has three delivery variants.
questions:
- id: photo_delete
  sequence_index: 1
  eyebrow: a small hostage situation
  whispers:
  - the delete button has filed a complaint
  - I saw that
  - the evidence is staying
  variants:
  - id: soft
    text: These photos are kind of silly. Want me to delete them?
    buttons:
    - label: delete them
      role: wrong
      personality: scaredy
    - label: I am not above bribery
      role: correct
      on_hover: grow
      on_click: grow
      next: which_one
    minigame_pool:
    - buttons
    microcopy:
    - the delete button is already running
    - you are doing the guilty face
    - I saw you try to hide the evidence
    animation: pillow
  - id: bold
    text: I dare you to delete these photos. I double dare you.
    minigame_pool:
    - catch_object
    - drag_to_target
    - rhythm_tap
    - feed_cat
    microcopy:
    - the evidence is faster than you
    - caught it yet
    - it is very attached to me
    animation: snap
  - id: tease
    text: You would not delete these. You love them too much.
    minigame_pool:
    - scratch_card
    - choose_item
    - trace_line
    - spin_wheel
    microcopy:
    - go on, scratch it
    - you are not fooling anyone
    - the photos are load-bearing
    animation: drift
- id: which_one
  sequence_index: 2
  eyebrow: be honest
  whispers:
  - you hate both. I can tell.
  - the photos are not listening
  - this is a safe space. not really.
  variants:
  - id: honest
    text: Which one do you hate more? The park one where you are looking back, or the laughing one with your eyes closed?
    buttons:
    - label: the park one
      role: wrong
      personality: sassy
    - label: the laughing one
      role: wrong
      personality: peekaboo
    - label: both. unfortunately.
      role: correct
      on_hover: grow
      on_click: grow
      next: yarn_picker
    minigame_pool:
    - buttons
    microcopy:
    - you hate both. I can tell.
    - the laughing one is right there
    - no wrong answer, only evidence
    animation: pillow
  - id: investigator
    text: Investigate the evidence. Which one is worse? Take your time. I have all day.
    minigame_pool:
    - choose_item
    - sort_bins
    - feed_cat
    - rhythm_tap
    microcopy:
    - the park one has a strong case
    - the laughing one is a repeat offender
    - you are very thorough
    animation: shutter
  - id: evidence
    text: One of these is your villain origin story. The other is mine. Which is which?
    minigame_pool:
    - memory_match
    - catch_object
    - spin_wheel
    - trace_line
    microcopy:
    - the evidence is not going anywhere
    - you are overthinking it
    - both. it is both.
    animation: stitch
- id: yarn_picker
  sequence_index: 3
  eyebrow: a brief distraction
  whispers:
  - the yarn will not save you
  - you are very good at changing the subject
  - one minute. I am timing you.
  variants:
  - id: distraction
    text: Fine. We can look at yarn for one minute. The photos are still staying, by the way.
    minigame_pool:
    - drag_to_target
    - pull_thread
    - feed_cat
    - rhythm_tap
    microcopy:
    - the yarn will not save you
    - you are very good at changing the subject
    - one minute. I am timing you.
    animation: stitch
  - id: dare
    text: Pick a yarn. Any yarn. It will not distract me from the photos.
    minigame_pool:
    - hold_fill
    - tilt_pour
    - shake_reveal
    - blow_reveal
    microcopy:
    - the warm one. obviously
    - you are stalling
    - the photos are still here
    animation: bounce
  - id: pick
    text: Choose a colour. I will pretend this is not a distraction.
    minigame_pool:
    - choose_item
    - memory_match
    - trace_line
    - spin_wheel
    microcopy:
    - good taste. still the photos.
    - you are very easy to distract
    - one minute only
    animation: pillow
- id: lock_screen
  sequence_index: 4
  eyebrow: full disclosure
  whispers:
  - you are trying to calculate how to steal my phone
  - the photo is load-bearing
  - I can see you plotting
  variants:
  - id: current
    text: The laughing one is my lock screen now. Every time I open my phone, you are mid-cackle.
    minigame_pool:
    - scratch_card
    - wipe_fog
    - blow_reveal
    - trace_line
    microcopy:
    - you are trying to calculate how to steal my phone
    - the photo is load-bearing
    - I can see you plotting
    animation: shimmer
  - id: phone
    text: My lock screen is the laughing one. You are one tap away from seeing it.
    buttons:
    - label: change it
      role: wrong
      personality: clumsy
    - label: I will steal your phone
      role: wrong
      personality: sneaky
    - label: worth it
      role: correct
      on_hover: grow
      on_click: grow
      next: wallpaper
    minigame_pool:
    - buttons
    microcopy:
    - no no no
    - I can see you plotting
    - the photo is staying
    animation: snap
  - id: smirk
    text: I want to see the face you make when you see my lock screen.
    minigame_pool:
    - catch_object
    - camera_selfie
    - spin_wheel
    - rhythm_tap
    microcopy:
    - there it is
    - I saw that face
    - worth it
    animation: drift
- id: wallpaper
  sequence_index: 5
  eyebrow: more evidence
  whispers:
  - you blinked. it is captured forever.
  - the printer is already warm
  - you cannot delete a wallpaper with your mind
  variants:
  - id: current
    text: The park one is my wallpaper. The one where you are mid-blink and slightly furious.
    buttons:
    - label: delete it
      role: wrong
      personality: showoff

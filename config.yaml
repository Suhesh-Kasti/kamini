# ================================================================
# QUESTIONS
# These run in order unless a button says otherwise.
# Each button:
#   label        what she sees
#   role         correct | wrong | trick | neutral
#   on_hover     behavior when a cursor hovers (desktop)
#   on_tap       behavior when a finger lands (mobile)
#   on_click     behavior when the button activates
#   labels_cycle labels that rotate on wrong taps
#   next         question id, or "ending". Correct buttons without
#                next quietly move to the following question.
#   note         optional small line under this button
# Every behavior name is in src/scripts/behaviors.ts.
# ================================================================
questions:

  - id: "photo_delete"
    eyebrow: "about those photos"
    text: "Do you want me to delete these photos?"
    whispers:
      - "that button is feeling shy"
      - "it really does not want to be pressed"
      - "you are chasing a coward"
    buttons:
      - label: "Yes"
        role: "wrong"
        on_hover: "runaway"
        on_tap: "runaway"
        on_click: "swap_label"
        labels_cycle: ["Yes", "wait no", "please no", "I did not mean it", "okay stop"]
      - label: "No"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "photo_confirm"
    transition_out: "fade_soft"

  - id: "photo_confirm"
    eyebrow: "just checking"
    text: "Are you sure?"
    whispers:
      - "you said no already, remember"
      - "I am writing that down"
    buttons:
      - label: "No"
        role: "correct"
        on_hover: "grow"
        on_click: "swap_roles"
        next: "yarn_picker"
      - label: "Yes"
        role: "wrong"
        on_hover: "shrink"
        on_tap: "jelly"
    transition_out: "bounce_warm"

  - id: "yarn_picker"
    eyebrow: "a small favour"
    text: "Help me pick a yarn color."
    theme_override: "cozy_crochet"
    whispers:
      - "that one unravelled a little"
      - "it is not the one, and it knows"
      - "the yarn is being dramatic"
    buttons:
      - label: "dusty rose"
        role: "wrong"
        on_hover: "runaway"
        on_tap: "unravel"
        on_click: "unravel"
      - label: "warm sage"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "compliment_trap"
      - label: "butter cream"
        role: "wrong"
        on_hover: "peek_a_boo"
        on_tap: "unravel"
        on_click: "unravel"
    transition_out: "thread_pull"

  - id: "compliment_trap"
    eyebrow: "true facts"
    text: "You are the cutest."
    whispers:
      - "says the cutest one"
      - "that answer is hiding now"
      - "you are not escaping that compliment"
    buttons:
      - label: "I know"
        role: "wrong"
        on_hover: "peek_a_boo"
        on_tap: "hide_behind"
        on_click: "swap_label"
        labels_cycle: ["I know", "I mean", "maybe", "fine, you too"]
      - label: "You are cuter"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "silly_sneeze"
    transition_out: "fade_soft"

  - id: "silly_sneeze"
    eyebrow: "no reason"
    text: "Want to see something silly?"
    theme_override: "just_for_fun"
    whispers:
      - "bless you, tiny button"
      - "it sneezes when nervous"
      - "that one has no manners"
    buttons:
      - label: "bless you"
        role: "wrong"
        on_hover: "sneeze"
        on_tap: "sneeze"
        on_click: "sneeze"
        labels_cycle: ["bless you", "again?", "oh no", "gesundheit", "sit still"]
      - label: "okay, show me"
        role: "correct"
        on_hover: "grow"
        on_click: "jelly"
        next: "final_ask"
    transition_out: "bounce_warm"

  - id: "final_ask"
    eyebrow: "last one, promise"
    text: "Can I keep you, exactly like this?"
    # Optional per theme wording. If the active theme is not listed,
    # the text above is used.
    text_by_theme:
      angry_kitten: "Still mad at me? Can I sit with you anyway?"
      sad_cloud: "Can I stay here until the clouds move?"
      sweet_ask: "Say yes and I will owe you one forever."
      shopping_muse: "Can I keep you, and maybe carry the bags?"
      save_the_coins: "Can we keep saving for our little someday?"
      cozy_crochet: "Can I keep you, even when I drop a stitch?"
      just_for_fun: "Can I keep you, exactly like this?"
    whispers:
      - "the button is patient, unlike me"
      - "it is a very easy yes"
    buttons:
      - label: "obviously"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "ending"
      - label: "let me think"
        role: "wrong"
        on_hover: "sleepy"
        on_tap: "sleepy"
        on_click: "sleepy"
        labels_cycle: ["let me think", "hmm", "still thinking", "okay fine", "yes"]
    transition_out: "ending_glow"

# The ending is chosen by the active theme's ending.animation.
# After the ending, she can replay it or start again.
ending:
  replay_label: "one more time"
  restart_label: "from the top"
  skip_label: "skip ahead"

# ================================================================
# THE TINY STAR
# A soft settings corner she has to notice. Local only.
# ================================================================
easter_egg:
  trigger: "tiny_star_corner"
  unlock_after_taps: 2
  panel_title: "a little secret"
  panel_subtitle: "just between us, on this phone"
  hint_after_seconds: 0
  # Values saved to localStorage and never sent anywhere.
  settings:
    theme: true
    music_volume: true
    reduced_motion: true
    replay_ending: true

install:
  title: "keep me close"
  body: "so it is there when you miss me."
  button: "add"
  dismiss: "not now"

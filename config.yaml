# ================================================================
# QUESTIONS
# All flow lives here. Roles and behaviors are in src/scripts.
# transition_out: "theme" uses the active theme's motion language.
# ================================================================
questions:

  - id: "photo_delete"
    eyebrow: "a small hostage situation"
    text: "I found two photos of you that you have been trying to bury. I have them. Both."
    whispers:
      - "the delete button is already running"
      - "I saw you try to hide the evidence"
      - "you are doing the guilty face"
    buttons:
      - label: "delete them"
        role: "wrong"
        on_hover: "runaway"
        on_tap: "runaway"
        on_click: "swap_label"
        labels_cycle: ["delete them", "okay just one", "fine, neither", "I give up", "you are impossible"]
      - label: "I am not above bribery"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "which_one"
    transition_out: "theme"

  - id: "which_one"
    eyebrow: "be honest"
    text: "Which one do you hate more? The park one where you are looking back, or the laughing one with your eyes closed?"
    whispers:
      - "you hate both. I can tell."
      - "the photos are not listening"
      - "this is a safe space. not really."
    buttons:
      - label: "the park one"
        role: "wrong"
        on_hover: "shrink"
        on_tap: "jelly"
        on_click: "jelly"
      - label: "the laughing one"
        role: "wrong"
        on_hover: "peek_a_boo"
        on_tap: "hide_behind"
        on_click: "swap_label"
        labels_cycle: ["the laughing one", "actually both", "I refuse", "this is entrapment"]
      - label: "both. unfortunately."
        role: "correct"
        on_hover: "grow"
        on_click: "swap_roles"
        next: "yarn_picker"
    transition_out: "theme"

  - id: "yarn_picker"
    eyebrow: "a brief distraction"
    text: "Fine. We can look at yarn for one minute. The photos are still staying, by the way."
    theme_override: "cozy_crochet"
    whispers:
      - "the yarn will not save you"
      - "you are very good at changing the subject"
      - "one minute. I am timing you."
    buttons:
      - label: "dusty rose"
        role: "wrong"
        on_hover: "runaway"
        on_tap: "unravel"
        on_click: "unravel"
      - label: "warm sage"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "lock_screen"
      - label: "butter cream"
        role: "wrong"
        on_hover: "peek_a_boo"
        on_tap: "unravel"
        on_click: "unravel"
    transition_out: "theme"

  - id: "lock_screen"
    eyebrow: "full disclosure"
    text: "The laughing one is my lock screen now. Every time I open my phone, you are mid-cackle."
    whispers:
      - "you are trying to calculate how to steal my phone"
      - "the photo is load-bearing"
      - "I can see you plotting"
    buttons:
      - label: "change it"
        role: "wrong"
        on_hover: "peek_a_boo"
        on_tap: "hide_behind"
        on_click: "swap_label"
        labels_cycle: ["change it", "please", "I am asking nicely", "okay, keep it"]
      - label: "I will steal your phone"
        role: "wrong"
        on_hover: "shrink"
        on_tap: "jelly"
        on_click: "jelly"
      - label: "worth it"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "wallpaper"
    transition_out: "theme"

  - id: "wallpaper"
    eyebrow: "more evidence"
    text: "The park one is my wallpaper. The one where you are mid-blink and slightly furious."
    whispers:
      - "you blinked. it is captured forever."
      - "the printer is already warm"
      - "you cannot delete a wallpaper with your mind"
    buttons:
      - label: "delete it"
        role: "wrong"
        on_hover: "sneeze"
        on_tap: "sneeze"
        on_click: "sneeze"
        labels_cycle: ["delete it", "I will delete it myself", "give me the phone", "I am not joking"]
      - label: "I am telling everyone"
        role: "wrong"
        on_hover: "shrink"
        on_tap: "jelly"
        on_click: "jelly"
      - label: "keep it"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "final_ask"
    transition_out: "theme"

  - id: "final_ask"
    eyebrow: "last one, promise"
    text: "Last one. I am printing both for the fridge. Any last words?"
    text_by_theme:
      angry_kitten: "You can be annoyed. The photos are still mine. Both of them."
      sad_cloud: "You can be sad about it. I am still printing both."
      sweet_ask: "I will trade you chocolate for the photos. No? Then I am printing both."
      shopping_muse: "You cannot buy your way out of these photos."
      save_the_coins: "These photos are an investment. I am keeping both."
      cozy_crochet: "You cannot crochet over the evidence. I am printing both."
      just_for_fun: "Last one. I am printing both for the fridge. Any last words?"
    whispers:
      - "the fridge has already picked a favourite"
      - "you can hate them in high resolution"
      - "this is the most fun I have had all week"
    buttons:
      - label: "print them"
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "ending"
      - label: "both. framed."
        role: "correct"
        on_hover: "grow"
        on_click: "grow"
        next: "ending"
      - label: "I will hide the printer"
        role: "wrong"
        on_hover: "sleepy"
        on_tap: "sleepy"
        on_click: "sleepy"
        labels_cycle: ["I will hide the printer", "where is the printer", "I am unplugging it", "fine, print them"]
    transition_out: "theme"

ending:
  replay_label: "one more time"
  restart_label: "start over"
  skip_label: "skip ahead"

# ================================================================
# THE TINY STAR
# A soft settings corner she has to notice. Local only.
# ================================================================
easter_egg:
  trigger: "tiny_star_corner"
  unlock_after_taps: 2
  panel_title: "the small controls"
  panel_subtitle: "just between us, on this phone"
  hint_after_seconds: 0
  settings:
    theme: true
    music_volume: true
    reduced_motion: true
    replay_ending: true

install:
  title: "keep this close"
  body: "so the evidence is always one tap away."
  button: "add to home"
  dismiss: "not now"

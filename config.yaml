# ================================================================
# QUESTIONS
# All flow lives here. Roles and behaviors are in src/scripts.
# transition_out: "theme" uses the active theme's motion language.
# ================================================================
# Core game registry. Ready games are selectable by the session planner.
# Coming soon games are visible in settings but never chosen.
minigames:
- id: scratch_card
  name: scratch the card
  description: rub the soft cover until the picture underneath peeks through.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: scratch below to get the password to the backups.
    image: images/portrait-02.webp
    reveal: awww. you look so adorable.
    caption: 'the password is: you are adorable.'
- id: camera_selfie
  name: catch the little camera
  description: catch the camera and it takes one still. local only.
  device_support:
  - camera
  - touch
  - mouse
  permissions:
  - camera
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    title: let me see the face I am trying to make smile
    body: This stays on your device. Nothing is uploaded. This is just for you and me.
    prompt: catch the camera to move forward.
    note: see, in those pictures you look cuter and younger than you look now.
    caption: kept on {date}
- id: catch_object
  name: catch the little heart
  description: a tiny heart drifts and dodges. catch it.
  device_support:
  - touch
  - mouse
  - sensor_gyro
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    target: the little heart
    icon: heart
    hint: caught it. it is both. obviously.
- id: drag_to_target
  name: drag it home
  description: drag the right little thing into the basket.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    target: the basket
    items:
    - label: dusty rose
      color: '#c98a92'
    - label: warm sage
      color: '#9aa37f'
      correct: true
    - label: butter cream
      color: '#e8d6a3'
    success: warm sage. good taste.
    hint: the warm one. the one that matches your patience.
- id: tilt_pour
  name: tilt to pour
  description: tilt the phone, or steer with the mouse, and pour the sparks home.
  device_support:
  - sensor_gyro
  - touch
  - mouse
  permissions:
  - motion
  fallback_game_id: drag_to_target
  enabled_by_default: true
  status: ready
  content:
    prompt: pour me the beer. get me drunk. then take my phone.
    mode: beer
    success: the glass is full. the phone is right there.
- id: hold_fill
  name: hold to fill
  description: press and hold until the little heart is full. let go early and it deflates.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: hold the heart until it is full.
    label: hold
- id: sort_bins
  name: sort the little things
  description: tap a thing, then tap the bin it belongs in.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: tap a thing, then tap keep or let go.
    bins:
    - keep
    - let go
    items:
    - label: the park one
      bin: keep
    - label: the laughing one
      bin: keep
    - label: the delete button
      bin: let go
- id: pet_character
  name: pet the sleepy cat
  description: swipe gently over the cat until it stretches awake.
  device_support:
  - touch
  - mouse
  - sensor_accel
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: pet the cat. cuddle with it. it has missed you.
    character: cat
- id: wipe_fog
  name: wipe the fog
  description: clear the misty glass to see what is hiding underneath.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: scratch_card
  enabled_by_default: true
  status: ready
  content:
    prompt: wipe the fog so you can see who is behind it.
    image: images/portrait-02.webp
    reveal: awww. you look so adorable.
    caption: you know this face.
- id: memory_match
  name: match the little pairs
  description: turn over the cards and find the pairs.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: solve this puzzle to be able to delete the photos.
    success: you solved the puzzle. now the backups.
    icons:
    - cat
    - dog
    - heart
    - star
- id: choose_item
  name: pick one
  description: a small table of nice things. pick the one that feels right.
  device_support:
  - touch
  - mouse
  - keyboard
  permissions:
  - none
  fallback_game_id: hold_fill
  enabled_by_default: true
  status: ready
  content:
    prompt: pick one. I will pretend not to have a favourite.
    items:
    - dusty rose
    - warm sage
    - butter cream
    correct: warm sage
- id: pull_thread
  name: pull the thread
  description: pull the loose thread and let the ball unravel into a note.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: drag_to_target
  enabled_by_default: true
  status: ready
  required_theme_affinity:
  - cozy_crochet
  content:
    prompt: pull the thread.
    reveal: those images are too cute to be deleted. I backed them up, made one my wallpaper and the other my lock screen, and I am keeping them. nice try.
- id: blow_reveal
  name: blow the cloud away
  description: a little breath clears the cloud. needs a microphone.
  device_support:
  - mic
  - touch
  - mouse
  permissions:
  - mic
  fallback_game_id: wipe_fog
  enabled_by_default: true
  status: ready
  content:
    prompt: blow at the cloud. a little puff is enough.
    reveal: there it is.
    caption: gone with a breath.
- id: rhythm_tap
  name: tap on the beat
  description: tap along and fill the little bar.
  device_support:
  - touch
  - mouse
  - keyboard
  permissions:
  - none
  fallback_game_id: hold_fill
  enabled_by_default: true
  status: ready
  content:
    prompt: tap when the ring blooms.
    hits: 6
    miss: almost. listen for the next one.
    hit: there.
- id: trace_line
  name: trace the line
  description: follow the dotted path without lifting your finger.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: follow the dotted line without lifting your finger.
    reveal: traced. remembered.
    caption: the line knows.
- id: shake_reveal
  name: shake it out
  description: a gentle shake shakes the hidden thing loose.
  device_support:
  - sensor_accel
  - touch
  permissions:
  - motion
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: shake the little box. gently.
    reveal: the note was in there.
    caption: shaken loose.
- id: feed_cat
  name: feed the cat
  description: drag a little snack to the cat and watch its face change.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: pet_character
  enabled_by_default: true
  status: ready
  content:
    prompt: feed the cat. it is supervising.
    foods:
    - label: a little fish
      icon: fish
    - label: a cookie
      icon: cookie-bite
    - label: a strawberry
      icon: heart
    full: full. happy. still judging you.
- id: spin_wheel
  name: spin the little wheel
  description: a soft wheel, a little swipe, and wherever it lands.
  device_support:
  - touch
  - mouse
  permissions:
  - none
  fallback_game_id: choose_item
  enabled_by_default: true
  status: ready
  content:
    prompt: spin it. whatever it lands on is true.
    segments:
    - both
    - both
    - obviously
    - both
    - framed
    - both
    result: both. obviously.

# Fixed story spine for the finished sequence.
questions:
- id: puzzle
  sequence_index: 1
  eyebrow: a small puzzle
  whispers:
  - start with the pairs.
  - the photos are not going anywhere.
  variants:
  - id: story
    text: Solve this puzzle to be able to delete the photos.
    minigame_pool:
    - memory_match
    microcopy:
    - start with the pairs.
    - the photos are not going anywhere.
    animation: pillow
- id: password
  sequence_index: 2
  eyebrow: the backup password
  whispers:
  - the password is under the soft cover.
  variants:
  - id: story
    text: Scratch below to get the password to the backups so you can delete the photos.
    minigame_pool:
    - scratch_card
    microcopy:
    - the password is under the soft cover.
    - a little more.
    animation: drift
- id: keep
  sequence_index: 3
  eyebrow: a very serious question
  whispers:
  - those are the cute ones.
  variants:
  - id: story
    text: You want me to keep those cute images of yours, don't you?
    buttons:
    - label: no, delete it
      role: wrong
      personality: sneaky
    - label: i won't talk to you
      role: wrong
      personality: sassy
    - label: but i don't look cute in these.
      role: correct
      on_hover: grow
      on_click: grow
      next: camera
    minigame_pool:
    - buttons
    microcopy:
    - those are the cute ones.
    - you are not deleting them.
    animation: snap
- id: camera
  sequence_index: 4
  eyebrow: proof of cuteness
  whispers:
  - catch the little camera.
  variants:
  - id: story
    text: You have to catch the camera to move forward.
    minigame_pool:
    - camera_selfie
    microcopy:
    - catch the little camera.
    - it is quicker than you think.
    animation: shimmer
- id: pour
  sequence_index: 5
  eyebrow: a little bribe
  whispers:
  - just a sip. then the phone.
  variants:
  - id: story
    text: Pour me the beer. Get me drunk. Then take my phone and delete the photos. Go on.
    minigame_pool:
    - tilt_pour
    microcopy:
    - just a sip. then the phone.
    - keep pouring.
    animation: drift
- id: thread
  sequence_index: 6
  eyebrow: the backups
  whispers:
  - pull the thread. there is a note.
  variants:
  - id: story
    text: Pull the thread. There is a note about the backups.
    minigame_pool:
    - pull_thread
    microcopy:
    - pull the thread.
    - a little more.
    animation: stitch

ending:
  replay_label: "one more time"
  restart_label: "start over"
  skip_label: "skip ahead"

ending_notes:
  angry_kitten:
  - you can print one. the other stays with me, claw marks and all.
  sad_cloud:
  - you can print one. the other stays here, safe and dry.
  sweet_ask:
  - you can print one. the other stays with me, wrapped in gold.
  shopping_muse:
  - you can print one. the other is the limited edition. mine.
  save_the_coins:
  - you can print one. the other is the investment.
  cozy_crochet:
  - you can print one. the other stays stitched to me.
  just_for_fun:
  - you can print one. I am keeping the other. obviously.

# ================================================================
# THE TINY STAR
# A soft settings corner she has to notice. Local only.
# ================================================================
easter_egg:
  trigger: "tiny_star_corner"
  unlock_after_taps: 2
  panel_title: "the small controls"
  panel_subtitle: "just between us, on this phone"
  hint_after_seconds: 0
  settings:
    theme: true
    music_volume: true
    reduced_motion: true
    replay_ending: true

install:
  title: "keep this close"
  body: "so the evidence is always one tap away."
  button: "add to home"
  dismiss: "not now"

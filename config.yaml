# type:      the three faces for this world, and their weights
# layout:    which composition the question scene uses
# decor:     which handmade material and marginalia live around it
# motion:    the scene transition and easing family
# material:  the physical paper, cloth, or studio surface
# scene:     which 3D scene the renderer builds
# signature_moment: the one interaction only this theme has
# hand_letter: the true hand-lettered SVG word for this theme
#
# Every face is unique across themes. If two themes share a font,
# this is not a redesign, it is a reskin.
# ================================================================

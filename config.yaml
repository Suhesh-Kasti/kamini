# ================================================================
# POCKET MOOD
# A small world that changes its weather for her.
#
# Every theme is a different site: type, layout, decor, motion,
# material, and 3D scene. Change one field, push, and the whole
# room changes with you. No code edits needed for content.
# ================================================================

active_theme: just_for_fun

global:
  her_name: "Kamini"
  # Print keepsake caption. {date} is replaced locally.
  print_caption: "kept on {date}"
  print_signature: "pocket mood"
  # Add a portrait here and it appears in the endings that opt in.
  # Relative paths live in public/, for example "images/portrait.webp".
  # A full https URL also works. Leave null for no photo.
  her_photo: null
  her_photo_alt: "a portrait"
  her_photo_caption: "my favourite person"
  # Or give the endings a small set to choose from. Each theme below
  # picks one with ending.photo_index.
  her_photos:
    - src: "images/portrait-01.webp"
      alt: "Portrait in the park, looking back at me"
      caption: "the park one. mid-blink, slightly furious."
    - src: "images/portrait-02.webp"
      alt: "Portrait laughing in front of the temple"
      caption: "the laughing one. eyes closed. zero notes."
  # The fallback track for every theme. A theme or question can override it.
  music: "audio/music.mp3"
  # always | rarely | never
  show_her_name: "rarely"
  # 0.0 to 1.0, the ceiling for every music track
  music_volume: 0.32
  # Honour the phone's reduce motion setting when true
  reduced_motion_fallback: true
  # Her device settings panel behind the tiny star
  easter_egg_enabled: true
  # Offer "add to home screen" after the ending
  install_prompt: true
  # Render quality ceilings
  max_pixel_ratio: 2
  max_pixel_ratio_mobile: 1.5
  # Build the active scene before revealing the canvas
  preload_scene: true
  # Number of taps on the tiny star before the secret opens
  secret_taps: 2

# A short breath before the first question.
intro:
  line: "hey, trouble"
  subline: "I made you a small thing. Try not to delete it."
  duration: 1200

# Shared whispers. A question can add its own list,
# which takes priority. One is chosen at random per tap.
whispers:
  - "nice try"
  - "I saw that"
  - "you are not subtle"
  - "the evidence is staying"
  - "I am putting them on the fridge"
  - "you are doing the face"
  - "this is not a negotiation"
  - "the delete button has filed a complaint"


# ================================================================

# ================================================================
# KAMINI
# A small handmade world. Everything here is editable.
# Change a value, push, and the whole experience shifts with you.
# No code edits needed for anything in this file.
# ================================================================

# Which personality she meets on open.
# One of: angry_kitten | sad_cloud | sweet_ask | shopping_muse |
#         save_the_coins | cozy_crochet | just_for_fun
active_theme: just_for_fun

global:
  her_name: "Kamini"
  # always | rarely | never
  show_her_name: "rarely"
  # 0.0 to 1.0, the ceiling for every music track
  music_volume: 0.35
  # Honour the phone's reduce motion setting when true
  reduced_motion_fallback: true
  # Her device settings panel behind the tiny star
  easter_egg_enabled: true
  # Offer "add to home screen" after the ending
  install_prompt: true
  # Cap the 3D renderer for calmer phones
  max_pixel_ratio: 2
  # Number of taps on the tiny star before the secret opens
  secret_taps: 2

# A short breath before the first question. Keep it soft.
intro:
  line: "hey, you"
  subline: "I left something here for you"
  duration: 3200

# These names map to the self hosted font files in src.
# Two heading faces maximum, one body face. Swap freely.
fonts:
  heading: "Dancing Script"
  subheading: "Parisienne"
  body: "Quicksand"

# Shared whispers. A question can add its own list,
# which takes priority. One is chosen at random per tap.
whispers:
  - "nice try"
  - "I saw that"
  - "you are a menace, and I adore you"
  - "hm. try again"
  - "still not letting you go"
  - "you really want to do that?"

# The tiny lines a behavior whispers when it does its thing.
# One is chosen at random from the matching list.
behavior_lines:
  swap_roles_correct: ["okay okay, you win"]
  swap_roles_wrong: ["hm. that is not what you meant"]
  dodge_accept: ["fine. you win this one"]
  disabled_polite: ["not this one, love"]
  escape: ["gone. it could not take the pressure"]
  sneeze: ["achoo"]
  sleepy: ["it fell asleep. let it rest"]

